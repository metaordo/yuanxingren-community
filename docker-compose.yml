version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/backend/data
      - ./uploads:/app/uploads
    depends_on:
      - zap

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    # ZAP is only reachable from the 'app' container via the internal Docker
    # network (service name 'zap', port 8090).  No host port is published —
    # this prevents unauthenticated control of the scanner from outside.
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=true
